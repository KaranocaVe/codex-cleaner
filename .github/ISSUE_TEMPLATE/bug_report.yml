name: Bug report
description: Report a reproducible problem without sharing private Codex data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Codex databases, rollout files, session text, cleanup manifests from real data, or unredacted logs. Report security vulnerabilities through [private vulnerability reporting](https://github.com/KaranocaVe/codex-cleaner/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 0.2.3 (5)
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Not sure
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples and redact personal paths, project names, session IDs, and text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add only redacted details that do not expose local Codex data.
